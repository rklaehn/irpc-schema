[package]
name = "n0-schema"
version = "0.1.0"
edition = "2021"
description = "simple schema language for rpc calls"
authors = ["rklaehn <rklaehn@protonmail.com>"]
license = "MIT OR Apache-2.0"
keywords = ["quic", "schema", "rpc"]


[dependencies]
blake3 = "1.8.2"
postcard = { version = "1.1.3", features = ["alloc"] }
serde = "1.0.228"
n0-schema-derive = { path = "n0-schema-derive", version = "0.1.0", optional = true }
irpc = { version = "0.15", optional = true }
bytes = { version = "1", optional = true }

[workspace]
members = ["n0-schema-derive"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "n0_schema_docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(n0_schema_docsrs)"] }

[dev-dependencies]
anyhow = "1"
derive_more = { version = "2", features = ["from"] }
hex = "0.4"
testresult = "0.4"

[features]
derive = ["dep:n0-schema-derive"]
irpc = ["dep:irpc"]
bytes = ["dep:bytes"]
default = ["derive", "irpc", "bytes"]
